<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening WhatsApp…</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #fdf2f8; color: #0f172a; margin: 0; display: grid; place-items: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 16px; padding: 28px 32px; box-shadow: 0 6px 24px rgba(219,39,119,.15); text-align: center; max-width: 440px; }
  h1 { font-size: 18px; margin: 0 0 8px; color: #be185d; }
  p { font-size: 14px; color: #64748b; margin: 6px 0 18px; }
  a.btn { display: inline-block; margin: 4px; padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; }
  .app { background: #16a34a; color: #fff; }
  .web { background: #f1f5f9; color: #0f172a; }
  .big { font-size: 16px; padding: 12px 22px; background: #16a34a; color: #fff; }
  .small { font-size: 12px; padding: 6px 10px; }
  .tiny { display: block; margin-top: 14px; font-size: 11px; color: #94a3b8; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1 id="h">✅ WhatsApp is open — don't click again</h1>
  <p id="sub">Clicking again will paste the message twice. You can close this tab.</p>
  <div id="btns" style="display:none">
    <p id="fbtext" style="font-size:12px;margin:14px 0 6px">WhatsApp didn't open?</p>
    <a id="app" class="btn app small" href="#">Open WhatsApp app</a>
    <a id="web" class="btn web small" href="#">Use WhatsApp Web</a>
  </div>
  <a id="switch" class="tiny" style="display:none"></a>
</div>
<script>
/* Yakson Today sheet → WhatsApp.
   The phone number and message come after "#" (p=<digits>&t=<text>), so they are never sent to any server.

   How it works (2026-11-07):
   - Each computer remembers what works for it (localStorage "yk_wa_mode"):
       app (default): open the WhatsApp desktop app. The command is sent twice (now and 2 s later): when the
            app is closed, the first command only starts it and the chat is lost; the second one opens the
            chat. If the app was already open, the second just shows the same chat — nothing is pasted twice.
       web: open the chat in ONE WhatsApp Web tab automatically.
     Clicking "Use WhatsApp Web" once switches that computer to web mode; the small link switches back.
   - WhatsApp Web must live in ONE tab only — a new web.whatsapp.com tab per click logs the staff out
     ("database error, relink your device"). So WhatsApp Web is always opened in a single named tab
     ("yakson_wa_web") that is reused every time. */
(function () {
  var q = new URLSearchParams(location.hash.slice(1));
  var p = (q.get('p') || '').replace(/\D/g, '');
  var t = q.get('t') || '';
  var enc = encodeURIComponent(t);
  var app = 'whatsapp://send?phone=' + p + '&text=' + enc;
  var web = 'https://web.whatsapp.com/send?phone=' + p + '&text=' + enc;
  var $ = function (id) { return document.getElementById(id); };
  var h = $('h'), sub = $('sub'), btns = $('btns'), fbtext = $('fbtext'), aApp = $('app'), aWeb = $('web'), sw = $('switch');
  var getMode = function () { try { return localStorage.getItem('yk_wa_mode') || 'app'; } catch (e) { return 'app'; } };
  var setMode = function (m) { try { localStorage.setItem('yk_wa_mode', m); } catch (e) {} };
  var closeSoon = function (ms) { setTimeout(function () { try { window.close(); } catch (e) {} }, ms); };
  var scrub = function () { try { history.replaceState(null, '', location.pathname); } catch (e) {} };

  aApp.href = app;
  aWeb.href = web;

  var sendApp = function () {
    var f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = app;
    document.body.appendChild(f);
    setTimeout(function () { try { f.remove(); } catch (e) {} }, 1500);
  };

  /* ---- ONE WhatsApp Web tab, via a "hub" tab (2026-11-07 evening) ----
     Tabs opened from the Google Sheet cannot see each other (Chrome isolates them), so window.open(…, name)
     cannot find the existing WhatsApp Web tab and opens a NEW one every time → WhatsApp Web logs out.
     Fix: the first yakson page that opens WhatsApp Web stays open as the HUB (it owns the WhatsApp tab).
     Every later customer link sends its chat to the hub (BroadcastChannel, same site), the hub switches
     its WhatsApp tab to that chat, and the new page closes itself. */
  var bc = null; try { bc = new BroadcastChannel('yk_wa'); } catch (e) {}
  var waWin = null, isHub = false;

  var becomeHub = function (w) {
    waWin = w; isHub = true;
    document.title = '🔗 WhatsApp link — keep open';
    h.textContent = '🔗 Keep this tab open';
    sub.textContent = 'Customer links now open in your WhatsApp Web tab. Do not close this tab. If you close WhatsApp Web, close this tab too.';
    btns.style.display = 'none'; sw.style.display = 'none';
    scrub();
    /* warn before closing the hub — closing it is the one thing that breaks the one-tab rule */
    window.onbeforeunload = function (e) { if (waWin && !waWin.closed) { e.preventDefault(); e.returnValue = ''; return ''; } };
  };
  if (bc) bc.onmessage = function (ev) {
    var m = ev.data || {};
    if (!isHub || m.type !== 'open') return;
    if (!waWin || waWin.closed) { isHub = false; return; } /* WhatsApp tab was closed — no answer, the new page takes over */
    try { waWin.location.href = m.web; } catch (e) { return; }
    try { waWin.focus(); } catch (e) {}
    bc.postMessage({ type: 'ack', id: m.id });
  };
  /* ask an existing hub to open this chat; cb(true) if it did */
  var askHub = function (cb) {
    if (!bc) return cb(false);
    var id = Math.random().toString(36).slice(2), done = false;
    var onAck = function (ev) { var m = ev.data || {}; if (m.type === 'ack' && m.id === id && !done) { done = true; bc.removeEventListener('message', onAck); cb(true); } };
    bc.addEventListener('message', onAck);
    bc.postMessage({ type: 'open', web: web, id: id });
    setTimeout(function () { if (!done) { done = true; bc.removeEventListener('message', onAck); cb(false); } }, 800);
  };

  /* open the chat in the ONE WhatsApp Web tab; returns true if the browser let us */
  var openWeb = function () {
    var w = null;
    try { w = window.open(web, 'yakson_wa_web'); } catch (e) {}
    if (!w) return false;
    try { w.focus(); } catch (e) {}
    becomeHub(w);
    return true;
  };

  var showSwitch = function (toMode) {
    sw.style.display = 'block';
    sw.textContent = toMode === 'web' ? 'Always use WhatsApp Web on this computer' : 'Use the WhatsApp app instead on this computer';
    sw.onclick = function () { setMode(toMode); location.reload(); };
  };

  if (!p) { btns.style.display = 'block'; return; }

  aWeb.onclick = function (e) {
    e.preventDefault();
    setMode('web'); /* this computer prefers WhatsApp Web from now on */
    askHub(function (ok) {
      if (ok) { h.textContent = '✅ Opened in your WhatsApp tab'; sub.textContent = 'Go to the WhatsApp tab. This tab will close.'; btns.style.display = 'none'; sw.style.display = 'none'; scrub(); closeSoon(1200); return; }
      if (!openWeb()) location.href = web; /* popup blocked: use this tab */
    });
  };
  aApp.onclick = function (e) { e.preventDefault(); setMode('app'); sendApp(); };

  if (getMode() === 'web') {
    document.title = 'Opening WhatsApp…';
    h.textContent = 'Opening WhatsApp Web…'; sub.textContent = '';
    askHub(function (ok) {
      if (ok) {
        h.textContent = '✅ Opened in your WhatsApp tab';
        sub.textContent = 'Go to the WhatsApp tab. This tab will close.';
        scrub(); closeSoon(1200);
        return;
      }
      /* no hub yet (first customer, or the link tab was closed) — one click opens WhatsApp Web and this tab becomes the hub */
      h.textContent = 'Click once to open WhatsApp Web';
      sub.textContent = 'This tab will stay open and send the next customers to the same WhatsApp tab.';
      fbtext.style.display = 'none';
      aWeb.className = 'btn big'; aWeb.textContent = 'Open WhatsApp Web';
      aApp.className = 'btn web small';
      btns.style.display = 'block';
      try { aWeb.focus(); } catch (e) {}
      showSwitch('app');
    });
    return;
  }

  /* app mode (default) */
  /* Close this tab only if the WhatsApp app really took focus (page lost focus / got hidden).
     If the app did not open, the tab stays and the backup buttons appear — never close before they show. */
  var appTookFocus = false;
  window.addEventListener('blur', function () { appTookFocus = true; });
  document.addEventListener('visibilitychange', function () { if (document.hidden) appTookFocus = true; });
  location.href = app;                       /* 1st: starts the app (or opens the chat if already running) */
  setTimeout(sendApp, 2000);                 /* 2nd: opens the chat once the app is up */
  setTimeout(scrub, 2500);
  setTimeout(function () { if (appTookFocus) { try { window.close(); } catch (e) {} } }, 4000);
  setTimeout(function () {                   /* backup buttons after 3s, small — so staff don't click twice */
    if (!appTookFocus) { h.textContent = 'WhatsApp app didn\'t open?'; sub.textContent = 'Use WhatsApp Web below — this computer will remember it.'; aWeb.className = 'btn big'; aApp.className = 'btn web small'; fbtext.style.display = 'none'; }
    btns.style.display = 'block'; showSwitch('web');
  }, 3000);
})();
</script>
</body>
</html>
