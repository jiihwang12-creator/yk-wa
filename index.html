<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening WhatsApp…</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #fdf2f8; color: #0f172a; margin: 0; display: grid; place-items: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 16px; padding: 28px 32px; box-shadow: 0 6px 24px rgba(219,39,119,.15); text-align: center; max-width: 420px; }
  h1 { font-size: 18px; margin: 0 0 8px; color: #be185d; }
  p { font-size: 14px; color: #64748b; margin: 6px 0 18px; }
  a.btn { display: inline-block; margin: 4px; padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; }
  .app { background: #16a34a; color: #fff; }
  .web { background: #f1f5f9; color: #0f172a; }
</style>
</head>
<body>
<div class="card">
  <h1>✅ WhatsApp is open — don't click again</h1>
  <p>Clicking again will paste the message twice. You can close this tab.</p>
  <div id="fallback" style="display:none">
    <p id="fbtext" style="font-size:12px;margin:14px 0 6px">WhatsApp didn't open?</p>
    <a id="app" class="btn app" href="#" style="font-size:12px;padding:6px 10px">Open WhatsApp app</a>
    <a id="web" class="btn web" href="#" style="font-size:12px;padding:6px 10px">Use WhatsApp Web</a>
  </div>
</div>
<script>
/* Yakson Today sheet → WhatsApp desktop app.
   The phone number and message come after "#" (p=<digits>&t=<text>), so they are never sent to any server. */
(function () {
  var q = new URLSearchParams(location.hash.slice(1));
  var p = (q.get('p') || '').replace(/\D/g, '');
  var t = q.get('t') || '';
  var app = 'whatsapp://send?phone=' + p + '&text=' + encodeURIComponent(t);
  var web = 'https://web.whatsapp.com/send?phone=' + p + '&text=' + encodeURIComponent(t);
  var fb = document.getElementById('fallback');
  var aApp = document.getElementById('app'), aWeb = document.getElementById('web');
  aApp.href = app;
  aWeb.href = web;

  /* 2026-11-07: WhatsApp Web must stay in ONE tab. Every sheet link opens a new tab, so sending each
     click to web.whatsapp.com made one WhatsApp Web tab per customer — WhatsApp Web then logs out
     ("database error, relink your device"). The Web button therefore opens the chat in a single named
     tab ("yakson_wa_web") that is reused every time. */
  aWeb.onclick = function (e) {
    e.preventDefault();
    var w = null;
    try { w = window.open(web, 'yakson_wa_web'); } catch (err) {}
    if (w) {
      try { w.focus(); } catch (err) {}
      aWeb.textContent = 'Opened in WhatsApp Web ✓';
      setTimeout(function () { try { window.close(); } catch (err) {} }, 1500);
    } else {
      location.href = web; /* popup blocked: use this tab */
    }
  };

  if (p) {
    location.href = app; /* WhatsApp app first, as always */
    setTimeout(function () { try { history.replaceState(null, '', location.pathname); } catch (e) {} }, 2500);
    if (/Star Vista/.test(t)) {
      /* Star Vista PC: the app sometimes opens only the chat list — show both buttons at once. */
      document.getElementById('fbtext').textContent = 'Chat not open in the app? Use WhatsApp Web:';
      fb.style.display = 'block';
      aWeb.style.fontSize = '15px'; aWeb.style.padding = '10px 18px'; aWeb.style.background = '#16a34a'; aWeb.style.color = '#fff';
      aApp.style.background = '#f1f5f9'; aApp.style.color = '#0f172a';
    } else {
      setTimeout(function () { try { window.close(); } catch (e) {} }, 2500);
      setTimeout(function () { fb.style.display = 'block'; }, 5000); /* backup buttons only after 5s, small — so staff don't click twice */
    }
  } else {
    fb.style.display = 'block';
  }
})();
</script>
</body>
</html>
